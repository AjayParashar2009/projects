<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="textarea">
            <textarea name="" id="FromText" placeholder="Write here"></textarea>
            <textarea name="" id="ToText" placeholder="Translated text"></textarea>
        </div>
        <div class="selectarea">
            <div class="select1">
                <i class="fa-solid fa-volume-high speak-icon" id="fromSpeaker"></i>
                <i class="fa-regular fa-copy copy-icon" id="fromCopy"></i>
                <select name="" id="SelectFrom">
                </select>
            </div>
            <div class="select2">
                <i class="fa-solid fa-volume-high speak-icon" id="ToSpeaker"></i>
                <i class="fa-regular fa-copy copy-icon" id="ToCopy"></i>
                <select name="" id="SelectTo">
                </select>
            </div>
        </div>
        <button id="Translate">Translate</button>
    </div>
    <script src="countries.js"></script>
    <script src="script.js"></script>
</body>

</html>
