<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sounds">
            <audio src="sounds/applause-cheer-236786.mp3" id="Applause"></audio>
            <audio src="sounds/boo-6377.mp3" id="Boo"></audio>
            <audio src="sounds/gasp-6253.mp3" id="Gasp"></audio>
            <audio src="sounds/065492_tadawav-80833.mp3" id="Tada"></audio>
            <audio src="sounds/evil-laugh-89423.mp3" id="Laugh"></audio>
            <audio src="sounds/buzzer-or-wrong-answer-20582.mp3" id="Worng"></audio>
        </div>
        <div class="SoundButton">
            <button class="Btn Applause">Applause</button>
            <button class="Btn Boo">Boo</button>
            <button class="Btn Gasp">Gasp</button>
            <button class="Btn Tada">Tada</button>
            <button class="Btn Laugh">Laugh</button>
            <button class="Btn Worng">Worng</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
